services:
  mysql:
    container_name: ContainerBD
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: beatwise05
      MYSQL_DATABASE: beatwise
    volumes:
      - mysql_data:/var/lib/mysql
      - ./aplicacao-web/src/database/script-tabelas.sql:/docker-entrypoint-initdb.d/01-tabelas.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]      
      interval: 10s
      timeout: 5s
      retries: 10

  site:
    container_name: container-site
    build:
      context: ./aplicacao-web
      dockerfile: dockerfile
    image: img-site
    restart: always
    env_file:
      - ./aplicacao-web/.env
    environment:
      APP_PORT: 3333
      DB_HOST: mysql
    ports:
      - "80:3333"
    depends_on:
      mysql:
        condition: service_healthy

  java:
    container_name: ContainerJava
    build:
      context: ./Java
      dockerfile: dockerfile
    image: img-java
    restart: always
    environment:
      LOG_URL: http://ContainerJava:8081/log
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: beatwise
      DB_URL: jdbc:mysql://mysql:3306/beatwise
      DB_USER: root
      DB_PASSWORD: beatwise05
      EMAIL: ${EMAIL}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
