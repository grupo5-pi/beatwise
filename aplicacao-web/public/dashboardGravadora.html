<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gravadora | BeatWise</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/imgs/logo_B.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dashboardGeral.css">
    <link rel="stylesheet" href="./css/padrao.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="./js/sidebar.js" defer></script>
    <script src="./js/controleDeAcesso.js"></script>
    <script src="./js/dashGravadora.js"></script>
</head>

<body class="dash-gravadora bw" onload="iniciar(), validarAcesso()">
    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <img src="./assets/imgs/Logo_nav.png" alt="banner da BeatWise" class="logo-banner">
            <img src="./assets/imgs/logo_B.png" alt="logo da BeatWise" class="logo-icone">
        </div>
        <hr>

        <ul>
            <li class="selected" id="dashboard-gravadora">
                <a href="./dashboardGravadora.html" title="Dashboard Gravadora">
                    <div class="icone-box"><img src="./assets/imgs/dashboard-white.svg" alt="" class="icone"></div>
                    <div class="texto">Gravadora</div>
                </a>
            </li>
            <li id="dashboard-marketing">
                <a href="./dashboardMarketing.html" title="Dashboard Marketing">
                    <div class="icone-box"><img src="./assets/imgs/dashboard-white.svg" alt="" class="icone"></div>
                    <div class="texto">Marketing</div>
                </a>
            </li>
            <li id="dashboard-produtor">
                <a href="./dashboardProdutor.html" title="Dashboard Produtor">
                    <div class="icone-box"><img src="./assets/imgs/dashboard-white.svg" alt="" class="icone"></div>
                    <div class="texto">Produtor</div>
                </a>
            </li>
            <li id="lista-musicas">
                <a href="./listaMusica.html" title="Músicas">
                    <div class="icone-box"><img src="./assets/imgs/music-white.svg" alt="" class="icone"></div>
                    <div class="texto">Músicas</div>
                </a>
            </li>
            <li id="recomendacao">
                <a href="./recomendacao.html" title="Recomendação">
                    <div class="icone-box"><img src="./assets/imgs/sliders-svgrepo-com.svg" alt="" class="icone"></div>
                    <div class="texto">Recomendação</div>
                </a>
            </li>
            <li id="metricas">
                <a href="./metricas.html" title="Métricas">
                    <div class="icone-box"><img src="./assets/imgs/chart-white.svg" alt="" class="icone"></div>
                    <div class="texto">Métricas</div>
                </a>
            </li>
            <li id="funcionarios">
                <a href="./cadastroFuncionario.html" title="Funcionários">
                    <div class="icone-box"><img src="./assets/imgs/user-pen-alt-1-svgrepo-com.svg" alt="" class="icone">
                    </div>
                    <div class="texto">Funcionários</div>
                </a>
            </li>
            <li id="notificacoes">
                <a href="./tela-notificacao.html" title="Notificações">
                    <div class="icone-box"><img src="./assets/imgs/svg-notificacao.png" alt="" class="icone"></div>
                    <div class="texto">Notificações</div>
                </a>
            </li>
        </ul>

        <div class="perfil">
            <img id="sidebar-foto" src="./assets/imgs/logo_B.png" alt="foto de perfil">
            <a id="nome-usuario" href="./perfil.html"></a>
        </div>
    </aside>

    <main class="conteudo">
        <div class="conteudo-topo">
            <div class="titulos">
                <h3>Bem vindo(a) <span data-usuario="primeiro-nome"></span></h3>
                <h1>Monitoramento de Indicadores estratégicos</h1>
            </div>
        </div>

        <div class="kpis-desempenho" id="lista_kpis"></div>

        <div class="graficos">
            <div class="grafico">
                <h3>Comparação de Reprodução entre Spotify(streaming) e YouTube (views)</h3>
                <div class="grafico-canvas"><canvas id="graficoLancamento"></canvas></div>
            </div>

            <div class="grafico">
                <h3>Gêneros com mais engajamento</h3>
                <div class="grafico-canvas"><canvas id="graficoGeneros"></canvas></div>
            </div>

            <div class="grafico">
                <h3>Tipo de álbum</h3>
                <div class="grafico-canvas"><canvas id="graficoTipoAlbum"></canvas></div>
            </div>
        </div>
    </main>

    <script>
        let dadosKpis = [];

        async function dadosDiferencaClipe() {
            let dados = await retornarDiferencaClipe();

            let engajamentoClipe = dados[0].comClipe;
            let engajamentoSemClipe = dados[0].semClipe;
            let diferenca = dados[0].porcentagem;

            dadosKpis.push({
                titulo: "Comparativo músicas com clipe X sem clipe",
                valor: engajamentoClipe > engajamentoSemClipe ? "Com Clipe" : "Sem Clipe",
                desc: engajamentoClipe > engajamentoSemClipe
                    ? `Músicas com clipe têm maior taxa de engajamento: <span class='destaque'>+${diferenca.toFixed(1)}%</span>`
                    : `Músicas sem clipe têm maior taxa de engajamento: <span class='destaque'>+${diferenca.toFixed(1)}%</span>`,
                seta: "↑↑"
            });
        }

        /* ---------- Buscas no back-end (KPIs e gráfico Tipo de álbum) ---------- */
        async function retornarMelhorGenero() {
            let resposta = await fetch("/dashGravadora/obterMelhorGenero");
            return await resposta.json();
        }

        async function retornarMelhorPlataforma() {
            let resposta = await fetch("/dashGravadora/obterMelhorPlataforma");
            return await resposta.json();
        }

        async function retornarFeatSolo() {
            let resposta = await fetch("/dashGravadora/obterFeatSolo");
            return await resposta.json();
        }

        async function retornarTipoAlbum() {
            let resposta = await fetch("/dashGravadora/obterTipoAlbum");
            return await resposta.json();
        }

        /* ---------- KPIs vindas do banco ---------- */
        async function dadosMelhorGenero() {
            let dados = await retornarMelhorGenero();
            if (!dados || !dados[0]) return;

            let genero = dados[0].genero;
            let porcentagem = Number(dados[0].porcentagem || 0);

            dadosKpis.push({
                titulo: "Gênero com melhor desempenho",
                valor: genero,
                desc: `${genero} está performando <span class='destaque'>${porcentagem.toFixed(0)}%</span> acima da média geral`,
                seta: "↑↑"
            });
        }

        async function dadosMelhorPlataforma() {
            let dados = await retornarMelhorPlataforma();
            let plataforma = dados[0].plataforma;
            let porcentagem = Number(dados[0].porcentagem || 0);

            dadosKpis.push({
                titulo: "Qual a melhor plataforma",
                valor: plataforma,
                desc: `O ${plataforma} apresenta maior taxa de aproveitamento: <span class='destaque'>+${porcentagem.toFixed(0)}%</span>`,
                seta: "↑↑"
            });
        }

        async function dadosFeatSolo() {
            let dados = await retornarFeatSolo();
            let vencedor = dados[0].vencedor;
            let porcentagem = Number(dados[0].porcentagem || 0);

            dadosKpis.push({
                titulo: "Comparativo Feat/Solo",
                valor: vencedor,
                desc: `Músicas ${vencedor.toLowerCase()} têm maior taxa de engajamento: <span class='destaque'>+${porcentagem.toFixed(0)}%</span>`,
                seta: "↑↑"
            });
        }

        async function carregarKpis() {
            let funcoes = [dadosDiferencaClipe, dadosMelhorGenero, dadosMelhorPlataforma, dadosFeatSolo];

            for (let i = 0; i < funcoes.length; i++) {
                try {
                    await funcoes[i]();
                } catch (erro) {
                    console.error(`Erro ao carregar KPI (${funcoes[i].name}):`, erro);
                }
            }

            lista_kpis.innerHTML = '';

            for (let i = 0; i < dadosKpis.length; i++) {
                let k = dadosKpis[i];

                lista_kpis.innerHTML += `
                    <div class="kpi">
                        <span class="kpi-titulo">${k.titulo}</span>
                        <div class="dado">${k.valor} <span class="kpi-seta">${k.seta}</span></div>
                        <span class="kpi-desc">${k.desc}</span>
                    </div>`;
            }
        }


        const roxo = '#7C3AED';
        const roxoClaro = '#A78BFA';
        const indigo = '#4F46E5';
        const lilas = '#C4B5FD';
        const texto = '#fff';
        const linhaGrade = 'rgba(139, 92, 246, 0.15)';

        Chart.defaults.color = texto
        Chart.defaults.font.family = 'Inter, sans-serif';
        Chart.defaults.borderColor = linhaGrade;
        Chart.defaults.maintainAspectRatio = false;

        async function carregarGraficos() {
            let categorias = await retornarDiferencaTipoAlbum();
            let viewsAlbum = categorias[0].youtube;
            let viewsSingle = categorias[1].youtube;
            let streamAlbum = categorias[0].spotify;
            let streamSingle = categorias[1].spotify;

            // 1) Tipo de lançamento x desempenho: Spotify x YouTube (em milhões)
            new Chart(graficoLancamento, {
                type: 'bar',
                data: {
                    labels: ['Álbum', 'Single'],
                    datasets: [
                        { label: 'Spotify', data: [streamAlbum, streamSingle], backgroundColor: roxo, borderRadius: 6 },
                        { label: 'YouTube', data: [viewsAlbum, viewsSingle], backgroundColor: roxoClaro, borderRadius: 6 }
                    ]
                },
                options: {
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: c => `${c.dataset.label}: ${formatarNumero(c.parsed.y)}`
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: v => formatarNumero(v)
                            }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });

            let generos = await retornarGeneroEngajamento();

            // 2) Gêneros com mais engajamento ((curtidas + comentários / views) * 100)
            new Chart(graficoGeneros, {
                type: 'bar',
                data: {
                    labels: [generos[0].genero, generos[1].genero, generos[2].genero, generos[3].genero, generos[4].genero, generos[5].genero, generos[6].genero, generos[7].genero],
                    datasets: [{
                        label: 'Engajamento',
                        data: [generos[0].engajamento, generos[1].engajamento, generos[2].engajamento, generos[3].engajamento, generos[4].engajamento, generos[5].engajamento, generos[6].engajamento, generos[7].engajamento],
                        backgroundColor: roxo,
                        borderRadius: 6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { beginAtZero: true, ticks: { callback: v => v + '%' } },
                        y: { grid: { display: false } }
                    }
                }
            });
        }

        // 3) Tipo de álbum (% do desempenho) - dados do banco
        async function carregarGraficoTipoAlbum() {
            let labels = ['Feat - Single', 'Feat - Álbum', 'Solo - Single', 'Solo - Álbum'];
            let valores = [0, 0, 0, 0];

            try {
                let dados = await retornarTipoAlbum();
                valores = labels.map(l => {
                    let item = dados.find(d => d.categoria == l);
                    return item ? Number(item.porcentagem) : 0;
                });
            } catch (erro) {
                console.error("Erro ao carregar gráfico Tipo de álbum:", erro);
            }

            new Chart(graficoTipoAlbum, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: valores,
                        backgroundColor: [roxo, indigo, roxoClaro, lilas],
                        borderColor: '#15131D',
                        borderWidth: 3
                    }]
                },
                options: {
                    cutout: '65%',
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12 } },
                        tooltip: { callbacks: { label: c => `${c.label}: ${c.parsed}%` } }
                    }
                }
            });
        }

        function formatarNumero(valor) {
            return new Intl.NumberFormat('pt-BR', {
                notation: 'compact',
                compactDisplay: 'short',
                maximumFractionDigits: 2
            }).format(valor);
        }

        function iniciar() {
            carregarKpis();
            carregarGraficos();
            carregarGraficoTipoAlbum();
        }
    </script>
</body>

</html>
