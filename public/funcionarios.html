<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários | BeatWise</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/imgs/logo_B.png">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/funcionarios.css">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="listas" onload="iniciarPagina()">
    <aside class="sidebar">
        <img src="./assets/imgs/banner.jpeg" alt="logo da BeatWise">
        <hr>

        <ul>
            <li><a>Dashboard</a></li>
            <li><a>Músicas</a></li>
            <li><a>Artistas</a></li>
            <li id="selected"><a>Funcionários</a></li>
        </ul>

        <div class="perfil">
            <img src="./assets/imgs/logo_B.png" alt="foto de perfil">
            <div id="nome-usuario">Lucas</div>
        </div>
    </aside>

    <!-- Lista -->
    <div class="conteudo">
        <div class="conteudo-topo">
            <div class="titulos">
                <h3>Bem vindo(a) <span>Lucas</span></h3>
                <h1>Funcionários Cadastrados</h1>
            </div>
        </div>

        <div class="tabela">
            <div class="pesquisa">
                <span class="icone-busca">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>

                <input id="pesquisa" type="text" placeholder="Buscar por nome, e-mail ou cargo..."
                    oninput="pesquisar()">
            </div>

            <div class="lista">
                <div class="coluna primary"><div class="top left">Nome</div></div>
                <div class="coluna"><div class="top">E-mail</div></div>
                <div class="coluna"><div class="top">Cargo</div></div>
                <div class="coluna"><div class="top direita">Ações</div></div>
            </div>

            <footer>
                <div id="exibicao"></div>

                <!-- Paginação -->
                <div class="paginacao">
                    <button id="anterior" onclick="voltarPagina()">❮</button>
                    <span id="pagina">Página 1</span>
                    <button id="proxima" onclick="avancarPagina()">❯</button>
                </div>
            </footer>
        </div>
    </div>

    <!-- POPUP: EDITAR -->
    <div class="modal" id="modal-editar">
        <a href="#" class="modal-fundo" aria-label="Fechar"></a>
        <div class="modal-caixa" role="dialog" aria-labelledby="titulo-editar">
            <h2 id="titulo-editar">Editar Funcionário</h2>

            <form action="#" method="post" onsubmit="salvarEdicao(event)">
                <label for="edit-nome">Nome do Funcionário</label>
                <input type="text" id="edit-nome" name="nome">

                <label for="edit-cargo">Cargo do Funcionário</label>
                <input type="text" id="edit-cargo" name="cargo">

                <label for="edit-email">E-mail</label>
                <input type="email" id="edit-email" name="email">

                <label for="edit-senha">Senha</label>
                <input type="password" id="edit-senha" name="senha" placeholder="Nova senha">

                <div class="modal-acoes">
                    <a href="#" class="btn btn-secundario">Cancelar</a>
                    <button type="submit" class="btn btn-primario">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- POPUP: EXCLUIR -->
    <div class="modal" id="modal-excluir" onclick="confirmarExclusao()">
        <a href="#" class="modal-fundo" aria-label="Fechar"></a>
        <div class="modal-caixa modal-confirmar" role="alertdialog" aria-labelledby="titulo-excluir">
            <h2 id="titulo-excluir">Tem certeza que deseja excluir o funcionário?</h2>
            <div class="modal-acoes">
                <a href="#" class="btn btn-secundario">Cancelar</a>
                <button type="button" class="btn btn-perigo">Excluir</button>
            </div>
        </div>
    </div>

    <script>
        const URL_JSON = './dados/funcionarios.json'; // ajuste o caminho do seu JSON
        const POR_PAGINA = 10;

        const ICONE_EDITAR = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
        const ICONE_EXCLUIR = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;

        let funcionarios = [];
        let filtrados = [];
        let paginaAtual = 1;
        let selecionado = null;

        async function iniciarPagina() {
    try {
        const resposta = await fetch(URL_JSON);
        console.log('Status:', resposta.status, resposta.url);

        if (!resposta.ok) {
            throw new Error(`HTTP ${resposta.status} ao buscar ${resposta.url}`);
        }

        const dados = await resposta.json();
        funcionarios = dados.funcionarios;
        filtrados = [...funcionarios];
        renderizar();
    } catch (erro) {
        console.error('Erro ao carregar funcionários:', erro);
        document.getElementById('exibicao').textContent = 'Erro: ' + erro.message;
    }
}

        function normalizar(texto) {
            return texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function pesquisar() {
            const termo = normalizar(document.getElementById('pesquisa').value.trim());
            filtrados = funcionarios.filter(f =>
                normalizar(`${f.nome} ${f.email} ${f.cargo}`).includes(termo)
            );
            paginaAtual = 1;
            renderizar();
        }

        function criarCelula(texto) {
            const div = document.createElement('div');
            div.className = 'celula';
            div.textContent = texto;
            div.title = texto;
            return div;
        }

        function criarAcoes(funcionario) {
            const div = document.createElement('div');
            div.className = 'celula acoes';

            const editar = document.createElement('a');
            editar.className = 'btn-icone';
            editar.href = '#modal-editar';
            editar.title = 'Editar';
            editar.innerHTML = ICONE_EDITAR;
            editar.addEventListener('click', () => abrirEditar(funcionario));

            const excluir = document.createElement('a');
            excluir.className = 'btn-icone';
            excluir.href = '#modal-excluir';
            excluir.title = 'Excluir';
            excluir.innerHTML = ICONE_EXCLUIR;
            excluir.addEventListener('click', () => { selecionado = funcionario; });

            div.append(editar, excluir);
            return div;
        }

        function renderizar() {
            const totalPaginas = Math.max(1, Math.ceil(filtrados.length / POR_PAGINA));
            if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;

            const inicio = (paginaAtual - 1) * POR_PAGINA;
            const fim = Math.min(inicio + POR_PAGINA, filtrados.length);
            const pagina = filtrados.slice(inicio, fim);

            const colunas = document.querySelectorAll('.lista .coluna');
            colunas.forEach(coluna => coluna.querySelectorAll('.celula').forEach(c => c.remove()));

            pagina.forEach(f => {
                colunas[0].appendChild(criarCelula(f.nome));
                colunas[1].appendChild(criarCelula(f.email));
                colunas[2].appendChild(criarCelula(f.cargo));
                colunas[3].appendChild(criarAcoes(f));
            });

            document.getElementById('exibicao').textContent = filtrados.length
                ? `Exibindo ${inicio + 1}-${fim} de ${filtrados.length}`
                : 'Nenhum funcionário encontrado';

            document.getElementById('pagina').textContent = `Página ${paginaAtual} de ${totalPaginas}`;
            document.getElementById('anterior').disabled = paginaAtual === 1;
            document.getElementById('proxima').disabled = paginaAtual === totalPaginas;
        }

        function voltarPagina() {
            if (paginaAtual > 1) {
                paginaAtual--;
                renderizar();
            }
        }

        function avancarPagina() {
            const totalPaginas = Math.ceil(filtrados.length / POR_PAGINA);
            if (paginaAtual < totalPaginas) {
                paginaAtual++;
                renderizar();
            }
        }

        /* ---------- POPUPS ---------- */
        function abrirEditar(funcionario) {
            selecionado = funcionario;
            document.getElementById('edit-nome').value = funcionario.nome;
            document.getElementById('edit-cargo').value = funcionario.cargo;
            document.getElementById('edit-email').value = funcionario.email;
            document.getElementById('edit-senha').value = '';
        }

        function fecharModal() {
            location.hash = '#';
        }

        // Só altera na memória (sem banco)
        function salvarEdicao(evento) {
            evento.preventDefault();
            if (!selecionado) return;

            selecionado.nome = document.getElementById('edit-nome').value.trim();
            selecionado.cargo = document.getElementById('edit-cargo').value.trim();
            selecionado.email = document.getElementById('edit-email').value.trim();

            fecharModal();
            renderizar();
        }

        // Só remove da memória (sem banco)
        function confirmarExclusao() {
            if (!selecionado) return;

            funcionarios = funcionarios.filter(f => f !== selecionado);
            filtrados = filtrados.filter(f => f !== selecionado);
            selecionado = null;

            fecharModal();
            renderizar();
        }
    </script>
</body>

</html>
