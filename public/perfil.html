<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Usuário</title>
  <link rel="shortcut icon" type="image/x-icon" href="assets/imgs/logo_B.png">

  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/sidebar.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/perfil.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="./js/sidebar.js" defer></script>
  <script src="./js/usuario.js" defer></script>
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <div class="logo-area">
      <img src="./assets/imgs/banner.jpeg" alt="banner da BeatWise" class="logo-banner">
      <img src="./assets/imgs/logo_B.png" alt="logo da BeatWise" class="logo-icone">
    </div>
    <hr>

    <ul>
      <li id="selected">
        <a href="dashboardGravadora.html">
          <div class="icone-box"><img src="./assets/imgs/dashboard-white.svg" alt="" class="icone"></div>
          <div class="texto">Dashboard</div>
        </a>
      </li>
      <li id="selected">
        <a href="dashboardMarketing.html">
          <div class="icone-box"><img src="./assets/imgs/dashboard-white.svg" alt="" class="icone"></div>
          <div class="texto">Dashboard</div>
        </a>
      </li>
      <li id="selected">
        <a href="dashboardProdutor.html">
          <div class="icone-box"><img src="./assets/imgs/dashboard-white.svg" alt="" class="icone"></div>
          <div class="texto">Dashboard</div>
        </a>
      </li>
      <li>
        <a href="listaMusica.html">
          <div class="icone-box"><img src="./assets/imgs/music-white.svg" alt="" class="icone"></div>
          <div class="texto">Músicas</div>
        </a>
      </li>
      <li>
        <a href="recomendacao.html">
          <div class="icone-box"><img src="./assets/imgs/sliders-svgrepo-com.svg" alt="" class="icone"></div>
          <div class="texto">Recomendação</div>
        </a>
      </li>
      <li>
        <a href="cadastroFuncionario.html">
          <div class="icone-box"><img src="./assets/imgs/user-pen-alt-1-svgrepo-com.svg" alt="" class="icone"></div>
          <div class="texto">Funcionários</div>
        </a>
      </li>
    </ul>
  </aside>

  <div class="conteudo">
    <div class="conteudo-topo">
      <div class="titulos">
        <h3>Bem vindo(a) <span id="boas-nome"></span></h3>
        <h1>Alterar Perfil</h1>
      </div>
      <button type="button" class="btn-sair" id="btn-sair">
        Sair
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="M16 17l5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
      </button>
    </div>

    <section class="perfil-card">
      <div class="perfil-resumo">
        <div class="foto-box">
          <img id="foto-preview" alt="Foto do usuário" hidden>
          <span id="foto-texto">Foto</span>
          <button type="button" class="foto-add" id="foto-btn" aria-label="Adicionar foto">+</button>
          <input type="file" id="foto-input" accept="image/*" hidden>
        </div>
        <div>
          <p class="resumo-nome" id="resumo-nome"></p>
          <p class="resumo-email" id="resumo-email"></p>
        </div>
      </div>

      <form id="form-perfil" novalidate>
        <div class="perfil-linha">
          <div class="perfil-campo">
            <label for="empresa">Empresa</label>
            <div class="campo-input bloqueado">
              <input type="text" id="empresa" readonly>
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9h-2zm-8-2a3 3 0 0 1 6 0v2H9V7z" />
              </svg>
            </div>
          </div>
          <div class="perfil-campo">
            <label for="cargo">Cargo</label>
            <div class="campo-input bloqueado">
              <input type="text" id="cargo" readonly>
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9h-2zm-8-2a3 3 0 0 1 6 0v2H9V7z" />
              </svg>
            </div>
          </div>
        </div>

        <div class="perfil-campo">
          <label for="email">Email</label>
          <div class="campo-input bloqueado">
            <input type="text" id="email" readonly>
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9h-2zm-8-2a3 3 0 0 1 6 0v2H9V7z" />
            </svg>
          </div>
        </div>

        <div class="perfil-campo">
          <label for="nome">Nome completo</label>
          <div class="campo-input">
            <input type="text" id="nome" readonly>
            <button type="button" class="icone-btn" data-editar="nome" aria-label="Editar nome">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="perfil-campo">
          <label for="senha">Senha</label>
          <div class="campo-input">
            <input type="password" id="senha" readonly>
            <button type="button" class="icone-btn" id="btn-alterar-senha" aria-label="Alterar senha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="perfil-acoes">
          <button type="button" class="btn-perfil btn-excluir" id="btn-excluir">
            Excluir
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6l-1 14H6L5 6" />
              <path d="M10 11v6M14 11v6" />
            </svg>
          </button>
          <button type="submit" class="btn-perfil btn-salvar">
            Salvar
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
              <path d="M17 21v-8H7v8" />
              <path d="M7 3v5h8" />
            </svg>
          </button>
        </div>

      </form>

    </section>
  </div>

  <div class="modal-overlay" id="modal-aviso" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="aviso-titulo">
      <div class="modal-icone" id="aviso-icone"></div>
      <h2 id="aviso-titulo"></h2>
      <p class="modal-texto" id="aviso-texto"></p>
      <div class="modal-acoes">
        <button type="button" class="btn-modal btn-modal-sec" id="aviso-cancelar">Cancelar</button>
        <button type="button" class="btn-modal btn-modal-pri" id="aviso-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Pop-up de alteração de senha -->
  <div class="modal-overlay" id="modal-senha" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="senha-titulo">
      <h2 id="senha-titulo">Alterar senha</h2>
      <p class="modal-texto">Por segurança, informe sua senha atual e digite a nova senha duas vezes.</p>

      <form id="form-senha" novalidate>
        <div class="perfil-campo">
          <label for="senha-antiga">Senha atual</label>
          <div class="campo-input">
            <input type="password" id="senha-antiga" autocomplete="current-password">
          </div>
        </div>

        <div class="perfil-campo">
          <label for="senha-nova">Nova senha</label>
          <div class="campo-input">
            <input type="password" id="senha-nova" autocomplete="new-password">
          </div>
        </div>

        <div class="perfil-campo">
          <label for="senha-confirma">Confirmar nova senha</label>
          <div class="campo-input">
            <input type="password" id="senha-confirma" autocomplete="new-password">
          </div>
        </div>

        <p class="modal-erro" id="senha-erro" role="alert"></p>

        <div class="modal-acoes">
          <button type="button" class="btn-modal btn-modal-sec" id="senha-cancelar">Cancelar</button>
          <button type="submit" class="btn-modal btn-modal-pri">Alterar senha</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    var usuarioId = sessionStorage.ID_FUNCIONARIO;
    if (!usuarioId) window.location.href = './login.html';

    /* ---------- Falar com o servidor ---------- */
    async function api(url, opcoes) {
      opcoes = opcoes || {};
      var resposta = await fetch(url, Object.assign({
        headers: { 'Content-Type': 'application/json' }
      }, opcoes));

      var dados = {};
      try { dados = await resposta.json(); } catch (e) { }

      if (!resposta.ok) throw new Error(dados.mensagem || 'Erro inesperado. Tente novamente.');
      return dados;
    }

    /* ---------- Mostrar os dados na tela ---------- */
    function mostrarNome(nome) {
      var primeiro = nome.split(' ')[0];
      document.getElementById('nome').value = nome;
      document.getElementById('resumo-nome').textContent = nome;
      document.querySelector('.nome-usuario').textContent = primeiro;
      if (window.Usuario) Usuario.atualizar({ nome: nome });
      document.getElementById('boas-nome').textContent = primeiro;
    }

    function mostrarFoto(url) {
      if (!url) return;
      var img = document.getElementById('foto-preview');
      img.src = url;
      img.hidden = false;
      document.getElementById('foto-texto').hidden = true;
      document.getElementById('sidebar-foto').src = url;
      if (window.Usuario) Usuario.atualizar({ foto: url });
    }

    async function carregarPerfil() {
      try {
        var p = await api('/funcionarios/perfil/' + usuarioId);
        mostrarNome(p.nome);
        mostrarFoto(p.foto);
        document.getElementById('email').value = p.email;
        document.getElementById('resumo-email').textContent = p.email;
        document.getElementById('empresa').value = p.empresa;
        document.getElementById('cargo').value = p.cargo;
        document.getElementById('senha').value = '••••••••';
      } catch (erro) {
        abrirAviso({ tipo: 'erro', titulo: 'Erro', texto: erro.message });
      }
    }

    /* ---------- Pop-up genérico ---------- */
    var modalAviso = document.getElementById('modal-aviso');
    var avisoOk = document.getElementById('aviso-ok');
    var avisoCancelar = document.getElementById('aviso-cancelar');
    var avisoCallback = null;

    function abrirAviso(o) {
      var tipo = o.tipo || 'info';
      var icones = { sucesso: '✓', erro: '✕', perigo: '!', info: 'i' };
      var icone = document.getElementById('aviso-icone');

      icone.className = 'modal-icone ' + tipo;
      icone.textContent = icones[tipo];
      document.getElementById('aviso-titulo').textContent = o.titulo;
      document.getElementById('aviso-texto').textContent = o.texto;

      avisoOk.textContent = o.confirmar || 'OK';
      avisoOk.className = 'btn-modal ' + (tipo === 'perigo' ? 'btn-modal-perigo' : 'btn-modal-pri');
      avisoCancelar.hidden = !o.cancelar;
      avisoCancelar.textContent = o.cancelar || 'Cancelar';

      avisoCallback = o.aoConfirmar || null;
      modalAviso.hidden = false;
      avisoOk.focus();
    }

    function fecharAviso() {
      modalAviso.hidden = true;
      avisoCallback = null;
    }

    avisoOk.addEventListener('click', function () {
      var cb = avisoCallback;
      fecharAviso();
      if (cb) cb();
    });
    avisoCancelar.addEventListener('click', fecharAviso);

    /* ---------- Pop-up de senha ---------- */
    var modalSenha = document.getElementById('modal-senha');
    var formSenha = document.getElementById('form-senha');
    var senhaErro = document.getElementById('senha-erro');

    function abrirModalSenha() {
      formSenha.reset();
      senhaErro.textContent = '';
      modalSenha.hidden = false;
      document.getElementById('senha-antiga').focus();
    }

    function fecharModalSenha() {
      modalSenha.hidden = true;
      formSenha.reset();
    }

    document.getElementById('btn-alterar-senha').addEventListener('click', abrirModalSenha);
    document.getElementById('senha-cancelar').addEventListener('click', fecharModalSenha);

    formSenha.addEventListener('submit', async function (e) {
      e.preventDefault();

      var antiga = document.getElementById('senha-antiga').value;
      var nova = document.getElementById('senha-nova').value;
      var confirma = document.getElementById('senha-confirma').value;

      if (!antiga || !nova || !confirma) { senhaErro.textContent = 'Preencha todos os campos.'; return; }
      if (nova.length < 8) { senhaErro.textContent = 'A nova senha deve ter pelo menos 8 caracteres.'; return; }
      if (nova === antiga) { senhaErro.textContent = 'A nova senha deve ser diferente da atual.'; return; }
      if (nova !== confirma) { senhaErro.textContent = 'A confirmação não coincide com a nova senha.'; return; }

      try {
        await api('/funcionarios/perfil/' + usuarioId + '/senha', {
          method: 'PUT',
          body: JSON.stringify({ senhaAtual: antiga, novaSenha: nova, confirmacao: confirma })
        });
        fecharModalSenha();
        abrirAviso({ tipo: 'sucesso', titulo: 'Senha alterada', texto: 'Sua senha foi atualizada com sucesso.' });
      } catch (erro) {
        senhaErro.textContent = erro.message;
      }
    });

    /* ---------- Fechar pop-ups com ESC ou clicando fora ---------- */
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (!modalSenha.hidden) fecharModalSenha();
      else if (!modalAviso.hidden) fecharAviso();
    });
    modalAviso.addEventListener('click', function (e) { if (e.target === modalAviso) fecharAviso(); });
    modalSenha.addEventListener('click', function (e) { if (e.target === modalSenha) fecharModalSenha(); });

    /* ---------- Editar nome ---------- */
    document.querySelectorAll('[data-editar]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var input = document.getElementById(btn.dataset.editar);
        input.readOnly = false;
        input.focus();
      });
    });

    /* ---------- Foto (reduz no navegador e salva no banco) ---------- */
    var fotoInput = document.getElementById('foto-input');
    document.getElementById('foto-btn').addEventListener('click', function () { fotoInput.click(); });

    function reduzirImagem(arquivo, lado, callback) {
      var leitor = new FileReader();
      leitor.onload = function () {
        var img = new Image();
        img.onload = function () {
          // Recorta o centro em quadrado e reduz para lado x lado
          var menor = Math.min(img.width, img.height);
          var canvas = document.createElement('canvas');
          canvas.width = lado;
          canvas.height = lado;
          canvas.getContext('2d').drawImage(
            img,
            (img.width - menor) / 2, (img.height - menor) / 2, menor, menor,
            0, 0, lado, lado
          );
          callback(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.src = leitor.result;
      };
      leitor.readAsDataURL(arquivo);
    }

    fotoInput.addEventListener('change', function () {
      var arquivo = fotoInput.files[0];
      if (!arquivo) return;

      if (arquivo.type.indexOf('image/') !== 0) {
        abrirAviso({ tipo: 'erro', titulo: 'Arquivo inválido', texto: 'Escolha uma imagem.' });
        fotoInput.value = '';
        return;
      }

      reduzirImagem(arquivo, 400, async function (dataUrl) {
        try {
          await api('/funcionarios/perfil/' + usuarioId + '/foto', {
            method: 'PUT',
            body: JSON.stringify({ foto: dataUrl })
          });
          mostrarFoto(dataUrl);
          abrirAviso({ tipo: 'sucesso', titulo: 'Foto atualizada', texto: 'Sua foto de perfil foi salva.' });
        } catch (erro) {
          abrirAviso({ tipo: 'erro', titulo: 'Não foi possível salvar a foto', texto: erro.message });
        } finally {
          fotoInput.value = '';
        }
      });
    });

    /* ---------- Salvar ---------- */
    document.getElementById('form-perfil').addEventListener('submit', function (e) {
      e.preventDefault();
      var nome = document.getElementById('nome').value.trim();

      if (nome.length < 3) {
        abrirAviso({ tipo: 'erro', titulo: 'Nome inválido', texto: 'Informe seu nome completo para continuar.' });
        return;
      }

      abrirAviso({
        tipo: 'info',
        titulo: 'Salvar alterações?',
        texto: 'Os dados do seu perfil serão atualizados.',
        confirmar: 'Salvar',
        cancelar: 'Cancelar',
        aoConfirmar: async function () {
          try {
            var r = await api('/funcionarios/perfil/' + usuarioId + '/nome', {
              method: 'PUT',
              body: JSON.stringify({ nome: nome })
            });
            mostrarNome(r.nome);
            document.getElementById('nome').readOnly = true;
            sessionStorage.NOME_USUARIO = r.nome;
            abrirAviso({ tipo: 'sucesso', titulo: 'Alterações salvas', texto: 'Seu perfil foi atualizado com sucesso.' });
          } catch (erro) {
            abrirAviso({ tipo: 'erro', titulo: 'Não foi possível salvar', texto: erro.message });
          }
        }
      });
    });

    /* ---------- Excluir ---------- */
    document.getElementById('btn-excluir').addEventListener('click', function () {
      abrirAviso({
        tipo: 'perigo',
        titulo: 'Excluir conta?',
        texto: 'Essa ação não pode ser desfeita. Todos os seus dados serão removidos.',
        confirmar: 'Excluir',
        cancelar: 'Cancelar',
        aoConfirmar: async function () {
          try {
            await api('/funcionarios/perfil/' + usuarioId, { method: 'DELETE' });
            sessionStorage.clear();
            abrirAviso({
              tipo: 'sucesso',
              titulo: 'Conta excluída',
              texto: 'Sua conta foi removida. Você será redirecionado ao login.',
              aoConfirmar: function () { window.location.href = './login.html'; }
            });
          } catch (erro) {
            abrirAviso({ tipo: 'erro', titulo: 'Não foi possível excluir', texto: erro.message });
          }
        }
      });
    });

    /* ---------- Sair ---------- */
    document.getElementById('btn-sair').addEventListener('click', function () {
      abrirAviso({
        tipo: 'info',
        titulo: 'Sair da conta?',
        texto: 'Você precisará fazer login novamente para acessar.',
        confirmar: 'Sair',
        cancelar: 'Continuar aqui',
        aoConfirmar: function () {
          sessionStorage.clear();
          window.location.href = './login.html';
        }
      });
    });

    carregarPerfil();
  </script>
</body>

</html>
