<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Música | BeatWise</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/imgs/logo_B.png">

    <link rel="stylesheet" href="./css/listas.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/listas.js"></script>
</head>

<body class="listas" onload="paginacao() ">
    <aside class="sidebar">
        <img src="./assets/imgs/banner.jpeg" alt="logo da BeatWise">
        <hr>

        <ul>
            <li><a>Dashboard</a></li>
            <li id="selected"><a>Músicas</a></li>
            <li><a>Artistas</a></li>
        </ul>

        <div class="perfil">
            <img src="./assets/imgs/logo_B.png" alt="foto de perfil">
            <div id="nome-usuario">Pedro</div>
        </div>
    </aside>

    <!-- Lista -->
    <div class="conteudo">
        <div class="conteudo-topo">
            <div class="titulos">
                <h3>Bem vindo(a) <span id="nome-usuario">Pedro</span></h3>
                <h1>Lista de Músicas</h1>
            </div>
        </div>

        <div class="tabela">
            <div class="pesquisa">
                <span class="icone-busca">
                    <svg xmlns="http://w3.org" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>

                <input id="pesquisa" type="text" placeholder="Buscar por música, artista ou álbum..." oninput="pesquisar()">
            </div>

            <div class="lista">
                <div class="coluna primary">
                    <div class="top left">Música</div>

                </div>
                <div class="coluna">
                    <div class="top">Artista(s)</div>

                </div>
                <div class="coluna">
                    <div class="top">Álbum</div>

                </div>
                <div class="coluna">
                    <div class="top">Youtube</div>

                </div>
                <div class="coluna">
                    <div class="top right">Spotify</div>

                </div>
            </div>

            <footer>
                <div id="exibicao"></div>

                <!-- Paginação -->
                <div class="paginacao">
                    <button id="anterior" onclick="voltarPagina()">❮</button>
                    <span id="pagina">Página 1</span>
                    <button id="proxima" onclick="avancarPagina()">❯</button>
                </div>
            </footer>
        </div>
    </div>

    <script>
        const colunas = document.querySelectorAll(".lista .coluna");
        let musicas = retornarMusicas();

        let paginaAtual = 1;
        const totalPaginas = Math.ceil(musicas.length / 10);

        function avancarPagina() {
            paginaAtual++;
            paginacao();
        }

        function voltarPagina() {
            paginaAtual--;
            paginacao();
        }

        function paginacao() {
            document.getElementById("pagina").textContent = `Página ${paginaAtual} de ${totalPaginas}`;

            if (paginaAtual == 1) {
                document.getElementById("anterior").disabled = true;
                document.getElementById("anterior").classList.add('disabled');
            } else if (paginaAtual == totalPaginas) {
                document.getElementById("proxima").disabled = true;
                document.getElementById("proxima").classList.add('disabled');
            } else {
                document.getElementById("anterior").classList.remove('disabled');
                document.getElementById("anterior").disabled = false;
                document.getElementById("proxima").classList.remove('disabled');
                document.getElementById("proxima").disabled = false;
            }

            renderizarMusica();
        }

        function criarCelula(texto) {
            const celula = document.createElement("div");
            celula.classList.add("grids");
            celula.textContent = texto;
            return celula;
        }

        function renderizarMusica() {
            // limpar os grids existentes para não atrapalhar a renderização
            colunas.forEach((coluna) => {
                coluna.querySelectorAll(".grids")
                    .forEach((linha) => linha.remove());
            });

            const itens = musicas.length > 10 ? 10 : musicas.length;
            const inicio = (paginaAtual - 1) * itens;
            const fim = inicio + itens;
            document.getElementById("exibicao").textContent = `Exibindo ${inicio + 1}-${fim} de ${musicas.length}`;

            for (let i = inicio; i < fim; i++) {
                const musica = tratarMusica(i);

                colunas[0].appendChild(criarCelula(musica.titulo));
                colunas[1].appendChild(criarCelula(musica.artistas));
                colunas[2].appendChild(criarCelula(musica.album));
                colunas[3].appendChild(criarCelula(formatarReproducoes(musica.youtube)));
                colunas[4].appendChild(criarCelula(formatarReproducoes(musica.spotify)));
            };
        }

        function formatarReproducoes(views) {
            const numero = Number(views);

            return new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 3 }).format(numero);
        }

        function tratarMusica(posicao) {
            const musica = musicas[posicao];

            return {
                titulo: musica.titulo != null ? musica.titulo : "Título não encontrado",
                artistas: Array.isArray(musica.artistas) ? musica.artistas.join(", ") : musica.artistas ?? "Artista não encontrado",
                album: musica.album != null ? musica.album : "Álbum não encontrado",
                youtube: musica.viewsYoutube != null ? musica.viewsYoutube : 0,
                spotify: musica.streamsSpotify != null ? musica.streamsSpotify : 0,
            }
        }

        <!-- Campo de pesquisa -->
        function pesquisar() {
            musicas = retornarMusicas();
            let palavraPesquisa = pesquisa.value.toLowerCase();

            if (palavraPesquisa == null || palavraPesquisa.trim() == '') {
                musicas = retornarMusicas();
            }

            let musicasFiltradas = [];
            for (let i = 0; i < musicas.length; i++) {
                if (Array.isArray(musicas[i].artistas)) {
                    for (let j = 0; j < musicas[i].artistas.length; j++) {
                        if (musicas[i].titulo.toLowerCase().includes(palavraPesquisa) || musicas[i].artistas[j].toLowerCase().includes(palavraPesquisa) || musicas[i].album.toLowerCase().includes(palavraPesquisa)) {
                            musicasFiltradas.push(musicas[i])
                            break
                        }
                    }
                } else {
                    if (musicas[i].titulo.toLowerCase().includes(palavraPesquisa) || musicas[i].artistas.toLowerCase().includes(palavraPesquisa) || musicas[i].album.toLowerCase().includes(palavraPesquisa)) {
                        musicasFiltradas.push(musicas[i])
                    }
                }
            }

            musicas = musicasFiltradas;
            paginacao();
        }
    </script>
</body>

</html>
