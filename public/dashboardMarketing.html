<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="dash-marketing bw"
    onload="carregarDadosGraficos().then(function () {carregarGraficos(); carregarDados()}); validarAcesso()">
    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <img src="./assets/imgs/Logo_nav.png" alt="banner da BeatWise" class="logo-banner">
            <img src="./assets/imgs/logo_B.png" alt="logo da BeatWise" class="logo-icone">
        </div>
        <hr>

        <ul>
            <li id="dashboard-gravadora">
                <a href="./dashboardGravadora.html" title="Dashboard Gravadora">
                    <div class="icone-box"><img src="./assets/imgs/dashboard-white.svg" alt="" class="icone"></div>
                    <div class="texto">Gravadora</div>
                </a>
            </li>
            <li class="selected" id="dashboard-marketing">
                <a href="./dashboardMarketing.html" title="Dashboard Marketing">
                    <div class="icone-box"><img src="./assets/imgs/dashboard-white.svg" alt="" class="icone"></div>
                    <div class="texto">Marketing</div>
                </a>
            </li>
            <li id="dashboard-produtor">
                <a href="./dashboardProdutor.html" title="Dashboard Produtor">
                    <div class="icone-box"><img src="./assets/imgs/dashboard-white.svg" alt="" class="icone"></div>
                    <div class="texto">Produtor</div>
                </a>
            </li>
            <li id="lista-musicas">
                <a href="./listaMusica.html" title="Músicas">
                    <div class="icone-box"><img src="./assets/imgs/music-white.svg" alt="" class="icone"></div>
                    <div class="texto">Músicas</div>
                </a>
            </li>
            <li id="recomendacao">
                <a href="./recomendacao.html" title="Recomendação">
                    <div class="icone-box"><img src="./assets/imgs/sliders-svgrepo-com.svg" alt="" class="icone"></div>
                    <div class="texto">Recomendação</div>
                </a>
            </li>
            <li id="metricas">
                <a href="./metricas.html" title="Métricas">
                    <div class="icone-box"><img src="./assets/imgs/chart-white.svg" alt="" class="icone"></div>
                    <div class="texto">Métricas</div>
                </a>
            </li>
            <li id="funcionarios">
                <a href="./cadastroFuncionario.html" title="Funcionários">
                    <div class="icone-box"><img src="./assets/imgs/user-pen-alt-1-svgrepo-com.svg" alt="" class="icone">
                    </div>
                    <div class="texto">Funcionários</div>
                </a>
            </li>
            <li id="notificacoes">
                <a href="./tela-notificacao.html" title="Notificações">
                    <div class="icone-box"><img src="./assets/imgs/svg-notificacao.png" alt="" class="icone"></div>
                    <div class="texto">Notificações</div>
                </a>
            </li>
        </ul>

        <div class="perfil">
            <img id="sidebar-foto" src="./assets/imgs/logo_B.png" alt="foto de perfil">
            <a id="nome-usuario" href="./perfil.html"></a>
        </div>
    </aside>

    <main class="conteudo">
        <div class="conteudo-topo">
            <div class="titulos">
                <h3>Bem vindo(a) <span data-usuario="primeiro-nome"></span></h3>
                <h1>Dashboard Marketing</h1>
            </div>
        </div>

        <div class="dash-alertas" id="lista_alertas">
        </div>

        <div class="dash-kpi" id="kpis">
        </div>

        <div class="graficos">
            <div class="grafico">
                <h3 class="grafico-titulo">Top 5 músicas: views no Youtube</h3>
                <div class="grafico-area"><canvas id="graficoYoutube"></canvas></div>
            </div>
            <div class="grafico">
                <h3 class="grafico-titulo">Top 5 músicas: streamings no Spotify</h3>
                <div class="grafico-area"><canvas id="graficoSpotify"></canvas></div>
            </div>
            <div class="grafico">
                <h3 class="grafico-titulo">Média de views por tipo de lançamento</h3>
                <div class="grafico-area"><canvas id="graficoLancamento"></canvas></div>
            </div>
        </div>
    </main>

    <script>
        let dadosKpis = [
            { titulo: "Comparativo músicas com clipe X sem clipe", dado: "", descricao: "", positivo: true },
            { titulo: "Engajamento por likes no Youtube", dado: "", descricao: "", positivo: true },
            { titulo: "Qual a melhor plataforma", dado: "", descricao: "", positivo: true },
            { titulo: "Comparativo Feat/Solo", dado: "", descricao: "", positivo: true }
        ];

        let dadosAlertas = [];

        function carregarDados() {
            fetch("/dashboard/marketing")
                .then(function (resposta) {
                    if (!resposta.ok) throw new Error("Erro " + resposta.status);
                    return resposta.json();
                })
                .then(function (dados) {
                    carregarAlertas(dados);
                    carregarKpis(dados);
                })
                .catch(function (erro) {
                    console.log(erro);
                });
        }

        function fmt(n, casas = 1) {
            return n.toFixed(casas).replace('.', ',');
        }

        // diferença percentual entre dois valores (0 se o menor for 0)
        function difPercentual(a, b) {
            let menor = Math.min(a, b);
            if (!menor || menor <= 0) return 0;
            return Math.abs(a - b) / menor * 100;
        }

        function carregarAlertas(dados) {
            dadosAlertas = [];

            // Alerta positivo: engajamento acima da média da base (likes ÷ views)
            if (dados.melhor) {
                dadosAlertas.push({
                    tipo: 'positivo',
                    texto: `A música ${tituloCurto(dados.melhor.nome)} tem taxa de likes/views ${fmt(dados.melhor.acima, 0)}% acima da média da base.`
                });
            }

            // Alerta negativo: desbalanceamento entre plataformas
            if (dados.desbalanceio.length > 0) {
                let m = dados.desbalanceio[0];
                let texto;

                if (m.streams > m.views) {
                    texto = `A música ${tituloCurto(m.nome)} tem ${formatarViews(m.streams)} de streamings no Spotify, mas só ${formatarViews(m.views)} de views no YouTube. Vale investir no YouTube.`;
                } else {
                    texto = `A música ${tituloCurto(m.nome)} tem ${formatarViews(m.views)} de views no YouTube, mas só ${formatarViews(m.streams)} de streamings no Spotify. Vale investir no Spotify.`;
                }

                dadosAlertas.push({ tipo: 'negativo', texto: texto });
            }

            // Renderização
            lista_alertas.innerHTML = '';

            for (let i = 0; i < dadosAlertas.length; i++) {
                let tipo = dadosAlertas[i].tipo;
                let icone = tipo == 'positivo' ? '✓' : '✗';

                lista_alertas.innerHTML += `
            <div class="dash-alerta dash-alerta-${tipo}">
                <span class="dash-alerta-icone">${icone}</span>
                <span>${dadosAlertas[i].texto}</span>
            </div>`;
            }
        }

        function carregarKpis(dados) {
            let comClipe = dados.clipe.com || 0;
            let semClipe = dados.clipe.sem || 0;
            let spotify = dados.plataforma.spotify || 0;
            let youtube = dados.plataforma.youtube || 0;
            let feat = dados.feat.feat || 0;
            let solo = dados.feat.solo || 0;

            // KPI 1 - Clipe x Sem clipe
            let clipeGanha = comClipe >= semClipe;
            let maior = Math.max(comClipe, semClipe);
            let menor = Math.min(comClipe, semClipe);

            dadosKpis[0].dado = clipeGanha ? 'Com Clipe' : 'Sem Clipe';
            dadosKpis[0].descricao = `Músicas ${clipeGanha ? 'com' : 'sem'} clipe têm maior taxa de engajamento: <span class="positivo">+${fmt(maior - menor)}%</span>`;
            dadosKpis[0].positivo = true;

            // KPI 2 - Música com maior taxa de likes (base toda)
            if (dados.melhor) {
                dadosKpis[1].dado = tituloCurto(dados.melhor.nome);
                dadosKpis[1].descricao = `${dados.melhor.nome} converte ${fmt(dados.melhor.taxa, 2)}% das views em likes: <span class="positivo">+${fmt(dados.melhor.acima, 0)}%</span> acima da média`;
                dadosKpis[1].positivo = true;
            }

            // KPI 3 - Melhor plataforma (média por música: streams x views)
            let spotifyGanha = spotify > youtube;
            let nomePlat = spotifyGanha ? 'Spotify' : 'YouTube';

            dadosKpis[2].dado = nomePlat;
            dadosKpis[2].descricao = `O ${nomePlat} apresenta maior taxa de aproveitamento: <span class="${spotifyGanha ? 'positivo' : 'negativo'}">+${fmt(difPercentual(spotify, youtube), 0)}%</span>`;
            dadosKpis[2].positivo = spotifyGanha;

            // KPI 4 - Feat x Solo
            let featGanha = feat >= solo;

            dadosKpis[3].dado = featGanha ? 'Feat' : 'Solo';
            dadosKpis[3].descricao = `Músicas ${featGanha ? 'feat' : 'solo'} têm maior taxa de engajamento: <span class="${featGanha ? 'positivo' : 'negativo'}">+${fmt(difPercentual(feat, solo), 0)}%</span>`;
            dadosKpis[3].positivo = featGanha;

            // Renderização
            kpis.innerHTML = '';

            for (let i = 0; i < dadosKpis.length; i++) {
                let k = dadosKpis[i];
                let classe = k.positivo ? 'positivo' : 'negativo';
                let seta = k.positivo ? '↑↑' : '↓↓';

                kpis.innerHTML += `
            <div class="kpi">
                <span class="kpi-titulo">${k.titulo}</span>
                <span class="kpi-valor">${k.dado} <span class="kpi-seta ${classe}">${seta}</span></span>
                <span class="kpi-descricao">${k.descricao}</span>
            </div>`;
            }
        }
    </script>

    <!-- Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <script>
        // Preenchidos com os dados vindos do banco (/dashboard/marketing)
        let topMusicasYoutube = [];
        let topMusicasSpotify = [];
        let tiposLancamento = [];

        function formatarViews(n) {
            if (n >= 1000000000) {
                return (n / 1000000000).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' bi';
            }
            return (n / 1000000).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mi';
        }

        // Quebra o nome em várias linhas (para caber no gráfico)

        function abreviar(nome, maxCaracteres) {
            if (nome.length <= maxCaracteres) return nome;
            return nome.slice(0, maxCaracteres - 1).trim() + '…';
        }

        function quebrarNome(nome, maxCaracteres) {
            let palavras = nome.split(' ');
            let linhas = [];
            let atual = '';

            for (let i = 0; i < palavras.length; i++) {
                if ((atual + ' ' + palavras[i]).trim().length > maxCaracteres && atual != '') {
                    linhas.push(atual);
                    atual = palavras[i];
                } else {
                    atual = (atual + ' ' + palavras[i]).trim();
                }
            }
            linhas.push(atual);
            return linhas;
        }

        function tituloCurto(nome) {
            let partes = nome.split(' - ');
            return partes[partes.length - 1];
        }

        function carregarDadosGraficos() {
            return fetch("/dashboard/marketing")
                .then(function (resposta) {
                    if (!resposta.ok) throw new Error("Erro " + resposta.status);
                    return resposta.json();
                })
                .then(function (dados) {
                    topMusicasYoutube = dados.topYoutube;
                    topMusicasSpotify = dados.topSpotify;
                    tiposLancamento = dados.tiposLancamento;
                });
        }

        function carregarGraficos() {
            if (!topMusicasYoutube.length || !topMusicasSpotify.length || !tiposLancamento.length) return;

            Chart.defaults.color = '#C4B5FD';
            Chart.defaults.borderColor = 'rgba(139, 92, 246, 0.15)';
            Chart.defaults.font.size = 16;
            Chart.defaults.color = '#C4B5FD';
            Chart.defaults.borderColor = 'rgba(139, 92, 246, 0.15)';

            let labelsYoutube = [], nomesYoutube = [], viewsYoutube = [], likesYoutube = [];
            let labelsSpotify = [], nomesSpotify = [], streamsSpotify = [];

            let youtube = topMusicasYoutube.slice();
            let spotify = topMusicasSpotify.slice();

            youtube.sort((a, b) => b.views - a.views);
            spotify.sort((a, b) => b.streamings - a.streamings);

            for (let i = 0; i < 5 && i < youtube.length; i++) {
                labelsYoutube.push(abreviar(youtube[i].nome, 20));
                nomesYoutube.push(youtube[i].nome);
                viewsYoutube.push(youtube[i].views / 1000000000);
                likesYoutube.push(youtube[i].likes / 1000000);
            }

            for (let i = 0; i < 5 && i < spotify.length; i++) {
                labelsSpotify.push(abreviar(spotify[i].nome, 20));
                nomesSpotify.push(spotify[i].nome);
                streamsSpotify.push(spotify[i].streamings / 1000000000);
            }

            // ---------- BUBBLE ----------
            let paleta = ['#7C3AED', '#A855F7', '#4F46E5', '#C4B5FD', '#22C55E'];

            // YouTube: x = views, y = likes, tamanho da bolha = taxa likes/views
            let taxasYoutube = [];
            for (let i = 0; i < youtube.length && i < 5; i++) {
                taxasYoutube.push(youtube[i].views > 0 ? youtube[i].likes / youtube[i].views * 100 : 0);
            }
            let minTaxa = Math.min(...taxasYoutube);
            let maxTaxa = Math.max(...taxasYoutube);

            let datasetsYoutube = [];
            for (let i = 0; i < taxasYoutube.length; i++) {
                let proporcao = maxTaxa > minTaxa ? (taxasYoutube[i] - minTaxa) / (maxTaxa - minTaxa) : 0.5;
                datasetsYoutube.push({
                    label: tituloCurto(youtube[i].nome),
                    data: [{ x: viewsYoutube[i], y: likesYoutube[i], r: 8 + proporcao * 14 }],
                    backgroundColor: paleta[i] + 'CC',
                    borderColor: paleta[i]
                });
            }

            // YouTube: barras horizontais (views embaixo, likes em cima)
            new Chart(graficoYoutube, {
                type: 'bar',
                data: {
                    labels: labelsYoutube,
                    datasets: [
                        { label: 'Views (bilhões)', data: viewsYoutube, backgroundColor: '#7C3AED', borderRadius: 4, xAxisID: 'x' },

                    ]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { boxWidth: 12, font: { size: 16 } } },
                        tooltip: {
                            titleFont: { size: 16 },
                            bodyFont: { size: 16 },
                            callbacks: { title: function (itens) { return nomesYoutube[itens[0].dataIndex]; } }
                        }
                    },
                    scales: {
                        y: { ticks: { autoSkip: false, font: { size: 16 } } },
                        x: {
                            position: 'bottom',
                            beginAtZero: true,
                            title: { display: true, font: { size: 16 }, text: 'Views (bilhões)', color: '#7C3AED' },
                            ticks: { font: { size: 16 }, maxTicksLimit: 5, callback: function (v) { return v.toLocaleString('pt-BR'); } }
                        },
                    }
                }
            });

            new Chart(graficoSpotify, {
                type: 'bar',
                data: {
                    labels: labelsSpotify,
                    datasets: [
                        { label: 'Streamings (bilhões)', data: streamsSpotify, backgroundColor: '#A855F7', borderRadius: 4 }
                    ]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { boxWidth: 10, font: { size: 16 } } },
                        tooltip: { callbacks: { title: function (itens) { return nomesSpotify[itens[0].dataIndex]; } } }
                    },
                    scales: {
                        y: { ticks: { autoSkip: false, font: { size: 16 } } },
                        x: {
                            beginAtZero: true,
                            title: { display: true, text: 'Streamings (bilhões)', color: '#A855F7' },
                            ticks: { maxTicksLimit: 5, callback: function (v) { return v.toLocaleString('pt-BR'); } }
                        }
                    }
                }
            });

            // Donut: média de views por música em cada tipo de lançamento
            let nomesTipos = [], medias = [], quantidades = [];
            let somaViews = 0, somaMusicas = 0;

            for (let i = 0; i < tiposLancamento.length; i++) {
                let t = tiposLancamento[i];
                nomesTipos.push(t.nome);
                medias.push(t.totalViews / t.quantidade);
                quantidades.push(t.quantidade);
                somaViews += t.totalViews;
                somaMusicas += t.quantidade;
            }

            let mediaGeral = somaViews / somaMusicas;

            let textoCentro = {
                id: 'textoCentro',
                afterDraw(chart) {
                    let ctx = chart.ctx;
                    let x = (chart.chartArea.left + chart.chartArea.right) / 2;
                    let y = (chart.chartArea.top + chart.chartArea.bottom) / 2;
                    ctx.save();
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = 'bold 22px Arial';
                    ctx.fillText(formatarViews(mediaGeral), x, y - 8);
                    ctx.fillStyle = '#C4B5FD';
                    ctx.font = '11px Arial';
                    ctx.fillText('média/música', x, y + 14);
                    ctx.restore();
                }
            };

            new Chart(graficoLancamento, {
                type: 'doughnut',
                data: {
                    labels: nomesTipos,
                    datasets: [{
                        data: medias,
                        backgroundColor: ['#7C3AED', '#A855F7', '#4F46E5', '#C4B5FD'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '68%',
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 16 } } },
                        tooltip: {
                            displayColors: false,
                            bodyFont: { size: 16 },
                            titleFont: { size: 16 },
                            callbacks: {
                                label: function (item) {
                                    return 'Média: ' + formatarViews(item.raw);
                                },
                                afterLabel: function (item) {
                                    return 'Músicas: ' + quantidades[item.dataIndex].toLocaleString('pt-BR');
                                }
                            }
                        }
                    }
                },
                plugins: [textoCentro]
            });
        }


    </script>
</body>
