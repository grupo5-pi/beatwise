<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do artista | BeatWise</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/imgs/logo_B.png">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/recomendacao.css">
    <link rel="stylesheet" href="./css/artistaDetalhe.css">
    <link rel="stylesheet" href="./css/padrao.css">
    <script src="./js/artistaDetalhe.js"></script>
    <script src="./js/sidebar.js" defer></script>
    <script src="./js/controleDeAcesso.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="rec-page bw" onload="carregarArtista(), validarAcesso()">
    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <img src="./assets/imgs/Logo_nav.png" alt="banner da BeatWise" class="logo-banner">
            <img src="./assets/imgs/logo_B.png" alt="logo da BeatWise" class="logo-icone">
        </div>
        <hr>

        <ul>
            <li id="dashboard-gravadora">
                <a href="./dashboardGravadora.html" title="Dashboard Gravadora">
                    <div class="icone-box"><img src="./assets/imgs/dashboard-white.svg" alt="" class="icone"></div>
                    <div class="texto">Gravadora</div>
                </a>
            </li>
            <li id="dashboard-marketing">
                <a href="./dashboardMarketing.html" title="Dashboard Marketing">
                    <div class="icone-box"><img src="./assets/imgs/dashboard-white.svg" alt="" class="icone"></div>
                    <div class="texto">Marketing</div>
                </a>
            </li>
            <li id="dashboard-produtor">
                <a href="./dashboardProdutor.html" title="Dashboard Produtor">
                    <div class="icone-box"><img src="./assets/imgs/dashboard-white.svg" alt="" class="icone"></div>
                    <div class="texto">Produtor</div>
                </a>
            </li>
            <li id="lista-musicas">
                <a href="./listaMusica.html" title="Músicas">
                    <div class="icone-box"><img src="./assets/imgs/music-white.svg" alt="" class="icone"></div>
                    <div class="texto">Músicas</div>
                </a>
            </li>
            <li class="selected" id="recomendacao">
                <a href="./recomendacao.html" title="Recomendação">
                    <div class="icone-box"><img src="./assets/imgs/sliders-svgrepo-com.svg" alt="" class="icone"></div>
                    <div class="texto">Recomendação</div>
                </a>
            </li>
            <li id="metricas">
                <a href="./metricas.html" title="Métricas">
                    <div class="icone-box"><img src="./assets/imgs/chart-white.svg" alt="" class="icone"></div>
                    <div class="texto">Métricas</div>
                </a>
            </li>
            <li id="funcionarios">
                <a href="./cadastroFuncionario.html" title="Funcionários">
                    <div class="icone-box"><img src="./assets/imgs/user-pen-alt-1-svgrepo-com.svg" alt="" class="icone"></div>
                    <div class="texto">Funcionários</div>
                </a>
            </li>
            <li id="notificacoes">
                <a href="./tela-notificacao.html" title="Notificações">
                    <div class="icone-box"><img src="./assets/imgs/svg-notificacao.png" alt="" class="icone"></div>
                    <div class="texto">Notificações</div>
                </a>
            </li>
        </ul>

        <div class="perfil">
            <img id="sidebar-foto" src="./assets/imgs/logo_B.png" alt="foto de perfil">
            <a id="nome-usuario" href="./perfil.html"></a>
        </div>
    </aside>

    <main class="rec-content">
        <a href="./recomendacao.html" class="art-voltar" onclick="voltarParaResultado()">← Voltar para
            recomendações</a>

        <div class="art-cabecalho">
            <div>
                <p class="art-rotulo">DETALHES DO ARTISTA</p>
                <h1 class="art-nome" id="nome_artista"></h1>
                <p class="art-info" id="info_artista"></p>
                <div class="art-tags" id="tags_artista"></div>
            </div>
        <div class="rec-avatar art-foto" id="avatar_artista"></div>
        </div>

        <hr class="art-linha">

        <h2 class="art-rotulo">DESEMPENHO NAS PLATAFORMAS</h2>
        <div class="art-stats">
            <div class="art-stat">
                <span class="art-stat-valor" id="stat_streams"></span>
                <span class="art-stat-nome">Streams</span>
                <span class="art-stat-fonte">Spotify</span>
            </div>
            <div class="art-stat">
                <span class="art-stat-valor" id="stat_views"></span>
                <span class="art-stat-nome">Visualizações</span>
                <span class="art-stat-fonte">YouTube</span>
            </div>
            <div class="art-stat">
                <span class="art-stat-valor" id="stat_curtidas"></span>
                <span class="art-stat-nome">Curtidas</span>
                <span class="art-stat-fonte">YouTube</span>
            </div>
            <div class="art-stat">
                <span class="art-stat-valor" id="stat_comentarios"></span>
                <span class="art-stat-nome">Comentários</span>
                <span class="art-stat-fonte">YouTube</span>
            </div>
        </div>

        <hr class="art-linha">

        <h2 class="art-rotulo">PERFIL SONORO</h2>
        <div class="art-perfil" id="perfil_sonoro"></div>

        <div class="art-infos">
            <div class="art-stat">
                <span class="art-stat-fonte">TEMPO</span>
                <span class="art-stat-valor" id="info_bpm"></span>
            </div>
            <div class="art-stat">
                <span class="art-stat-fonte">DURAÇÃO</span>
                <span class="art-stat-valor" id="info_duracao"></span>
            </div>
        </div>
    </main>
</body>

</html>
