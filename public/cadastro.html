<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | BeatWise</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/imgs/logo_B.png">

    <link rel="stylesheet" href="/css/style.css">
    <script src="./js/cadastro.js" defer></script>
</head>

<body class="login-cadastro  pagina-cadastro">
    <header>
        <img class="logo-header" src="./assets/imgs/logo_B.png" alt="BeatWise">

        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <ul id="nav-menu">
            <li><a href="index.html#home">HOME</a></li>
            <li><a href="index.html#quem-somos">QUEM SOMOS</a></li>
            <li><a href="index.html#valores">VALORES</a></li>
            <li><a href="index.html#contato">CONTATO</a></li>
            <li class="login-item">
                <a href="./login.html">
                    <img src="/assets/imgs/user.png" class="button-login" alt="Login">
                </a>
            </li>
        </ul>

        <a href="./login.html" class="button-login-desktop">
            <img src="/assets/imgs/user.png" class="button-login" alt="Login">
        </a>
    </header>

    <main>
        <div class="divisao">
            <div class="centro">
                <h1>Bem-vindo!</h1>
                <h5>Faça o Cadastro para continuar</h5>

                <h6>Caso já tenha um cadastro</h6>
                <a href="login.html" on><button>LOGIN</button></a>
            </div>
        </div>

        <div class="divisao">
            <div class="formulario" id="formulario1" style="display: flex;">
                <input type="text" id="input_razao_social" placeholder="Razão Social:" oninput="validarRazaoSocial()">
                <input type="text" id="input_email_empresa" placeholder="Email (empresa):" oninput="validarEmailEmpresa()">
                <input type="text" id="input_cnpj" placeholder="CNPJ:" maxlength="18" oninput="mascaraCNPJ(this), validarCNPJ()">
                <input type="text" id="input_telefone" placeholder="Telefone (empresa):" maxlength="15" oninput="mascaraTelefone(this), validarTelefone()">
                <div id="mensagem1"></div>
                <button onclick="continuar()">CONTINUAR</button>
            </div>
            <div class="formulario" id="formulario2" style="display: none;">
                <input type="text"  id="input_nome" placeholder="Nome:" oninput="validarNome()">
                <input type="text" id="input_email" placeholder="Email:" oninput="validarEmail()">
                <input type="password" id="input_senha" placeholder="Senha:" oninput="validarSenha()">
                <input type="password" id="input_confirmar_senha" placeholder="Confirmar senha:" oninput="validarConfirmSenha()">
                <div id="mensagem2"></div>
                <div class="div_button">
                    <button onclick="voltar()">VOLTAR</button>
                    <button onclick="cadastrar()">CADASTRAR</button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
